# Production stack. Lives in /opt/irs-az on the server next to .env (see README.md).
name: irs-az

services:
  # Connects out to Cloudflare as the "kitabxana" named tunnel (kitabxana.az, www) and hands
  # requests to Caddy; ./cloudflared holds config.yml and the tunnel's credentials JSON
  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on: [caddy]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api]

  web:
    image: ghcr.io/azadbilik/kitabxana-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000/api
      SITE_URL: https://${DOMAIN}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    image: ghcr.io/azadbilik/kitabxana-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/irs_az?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
      CORS_ORIGIN: https://${DOMAIN}
      # IndexNow pings (off without a key); state kept on the volume
      SITE_URL: https://${DOMAIN}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Reader sign-in (see deploy/tunnel/docker-compose.yml)
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Kitabxana.az <giris@kitabxana.az>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Poem of the day to a Telegram channel (off without both); hour is Baku time
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:-}
      TELEGRAM_POST_HOUR: ${TELEGRAM_POST_HOUR:-9}
      # Scanned source books (<key>.pdf), copied to /opt/irs-az/scans; see ScansService
      SCANS_DIR: /scans
    volumes:
      - api-data:/data
      - ./scans:/scans:ro
    depends_on:
      postgres: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      # The image has no curl; /api/health also checks the database
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations run before the server starts
      start_period: 90s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: irs_az
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d irs_az"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  postgres-data:
  meili-data:
  api-data:
