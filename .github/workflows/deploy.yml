name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push no longer cancels the run before it: with pushes minutes apart, every run was
# cancelled and nothing deployed. Runs on main now take turns: the running one finishes and
# deploys, and only the newest push waits (a newer one replaces an older one still waiting), so
# deploys only move forward. Pull requests still cancel their older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.2  # keep in sync with the Dockerfiles
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Typecheck
        run: pnpm check
      - name: Test API
        run: pnpm --dir apps/api test
      - name: Web tests and lint
        run: pnpm --dir apps/web test && pnpm --dir apps/web lint

  # Every kind of page, on a small fixture library, through axe-core in a real browser
  # (WCAG 2.2 A and AA, both themes, desktop and phone): a violation stops the deploy
  a11y:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a11y
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a11y"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.2  # keep in sync with the Dockerfiles
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Accessibility check
        run: scripts/a11y-ci.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a11y?schema=public

  build:
    needs: [check, a11y]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/nomadical/irs-az-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/nomadical/irs-az-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Runs once the server exists: set repo variable DEPLOY_HOST and secret DEPLOY_SSH_KEY.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, never cancelled mid-way (also across workflows started by hand)
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/Caddyfile,deploy/backup.sh
          target: /opt/irs-az
          strip_components: 1
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/irs-az
            # The job's own token pulls the private images; nothing long-lived on the server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            docker compose pull --quiet
            docker compose up -d --remove-orphans --wait
            # Cached pages name the old build's /_next chunks; purge with the purge-only token in .env
            set -a; . ./.env; set +a
            if [ -n "${CF_ZONE_ID:-}" ] && [ -n "${CF_PURGE_TOKEN:-}" ]; then
              curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
                -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
                --data '{"purge_everything":true}' > /dev/null && echo "cache purged"
            fi
            docker logout ghcr.io
            docker image prune -f
